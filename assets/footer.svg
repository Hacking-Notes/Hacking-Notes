<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Happy hacking">
<title>Happy hacking</title>
<defs>
  <linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#3e63dd"/><stop offset="1" stop-color="#d6409f"/></linearGradient>
  <clipPath id="type"><rect class="typer" x="369" y="60" width="486" height="30"/></clipPath>
</defs>
<style>
  .typer{transform-box:fill-box;transform-origin:left;animation:type 8s steps(45,end) infinite}
  @keyframes type{0%{transform:scaleX(0)}45%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
  .cursor{animation:cur 8s steps(45,end) infinite,blink 1s step-end infinite}
  @keyframes cur{0%{transform:translateX(0)}45%,90%{transform:translateX(486px)}100%{transform:translateX(0)}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="1198" height="168" rx="16" fill="#ffffff" stroke="#3e63dd" stroke-opacity="0.25"/>
<text x="345" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="18" fill="#3e63dd">$</text>
<g clip-path="url(#type)"><text x="369" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="18" fill="#1c2024" xml:space="preserve">exit 0  # true power: see what others cannot.</text></g>
<rect class="cursor" x="371" y="66" width="10" height="22" fill="#3e63dd"/>
<text x="600.0" y="128" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#60646c">Hacking Notes · by <tspan fill="url(#t)" font-weight="700">Hacking-Notes</tspan></text>
</svg>
