<svg xmlns="http://www.w3.org/2000/svg" width="580" height="280" viewBox="0 0 580 280" role="img" aria-label="Hacker Roadmap">
<title>Hacker Roadmap</title>
<defs>
  <radialGradient id="cg" cx=".12" cy=".2" r=".9"><stop offset="0" stop-color="#3aa6c7" stop-opacity=".16"/><stop offset="1" stop-color="#3aa6c7" stop-opacity="0"/></radialGradient>
  <pattern id="cd" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#3aa6c7" fill-opacity=".15"/></pattern>
  <clipPath id="cf"><rect width="580" height="280" rx="18"/></clipPath>
</defs>
<style>
  .sweep{stroke-dasharray:26 110;animation:sw 5s linear infinite} @keyframes sw{to{stroke-dashoffset:-136}}
  .blink{animation:bk 1.2s step-end infinite} @keyframes bk{50%{opacity:.2}}
  .flo{animation:flo 4s ease-in-out infinite} @keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .nd{animation:nd 4s ease-in-out infinite}@keyframes nd{0%,100%{opacity:.4}50%{opacity:1}}.ln{stroke-dasharray:6 8;animation:ln 1s linear infinite}@keyframes ln{to{stroke-dashoffset:-14}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#cf)">
  <rect width="580" height="280" fill="#15161a"/>
  <rect width="580" height="280" fill="url(#cg)"/>
  <rect x="236" width="344" height="280" fill="url(#cd)"/>
  <rect width="580" height="40" fill="#1a1b1f"/><circle cx="26" cy="20" r="5.5" fill="#ff5f57"/><circle cx="46" cy="20" r="5.5" fill="#febc2e"/><circle cx="66" cy="20" r="5.5" fill="#28c840"/><text x="290.0" y="25" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8b8e96">~/hacker-roadmap</text><circle cx="554" cy="20" r="4" fill="#3aa6c7"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
  <g transform="translate(130 162)"><path d="M-78 36 L-36 -6 L8 30 L50 -14 L84 20" fill="none" stroke="#2a2b30" stroke-width="3"/><path class="ln" d="M-78 36 L-36 -6 L8 30 L50 -14 L84 20" fill="none" stroke="#3aa6c7" stroke-width="3"/><g class="nd" style="animation-delay:0.0s"><circle cx="-78" cy="36" r="9" fill="#15161a" stroke="#3aa6c7" stroke-width="2.5"/><text x="-78" y="40" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#3aa6c7">1</text></g><g class="nd" style="animation-delay:0.35s"><circle cx="-36" cy="-6" r="9" fill="#15161a" stroke="#3aa6c7" stroke-width="2.5"/><text x="-36" y="-2" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#3aa6c7">2</text></g><g class="nd" style="animation-delay:0.7s"><circle cx="8" cy="30" r="9" fill="#15161a" stroke="#3aa6c7" stroke-width="2.5"/><text x="8" y="34" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#3aa6c7">3</text></g><g class="nd" style="animation-delay:1.0499999999999998s"><circle cx="50" cy="-14" r="9" fill="#15161a" stroke="#3aa6c7" stroke-width="2.5"/><text x="50" y="-10" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#3aa6c7">4</text></g><g class="nd" style="animation-delay:1.4s"><circle cx="84" cy="20" r="11" fill="#15161a" stroke="#3aa6c7" stroke-width="2.5"/><text x="84" y="24" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700" fill="#3aa6c7">5</text></g><text x="84" y="-28" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#3aa6c7">★</text></g>
  <text x="258" y="104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#eceef0">Hacker Roadmap</text>
  <text x="260" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#8b8e96">Structured paths from zero to pro — hobbyist,</text>
  <text x="260" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#8b8e96">bug bounty, certs &amp; a cheap degree route.</text>
  <rect x="260" y="212" width="74" height="26" rx="6" fill="#3aa6c7" fill-opacity=".10" stroke="#3aa6c7" stroke-opacity=".4"/><text x="297" y="229" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="700" letter-spacing=".5" fill="#3aa6c7">5 PATHS</text><rect x="344" y="212" width="59" height="26" rx="6" fill="#3aa6c7" fill-opacity=".10" stroke="#3aa6c7" stroke-opacity=".4"/><text x="373" y="229" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="700" letter-spacing=".5" fill="#3aa6c7">GUIDE</text>
  <rect x="260" y="238" width="108" height="26" rx="13" fill="#3aa6c7" fill-opacity=".12" stroke="#3aa6c7" stroke-opacity=".5"/>
  <text x="314" y="256" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="700" letter-spacing=".5" fill="#3aa6c7">★ start here</text>
</g>
