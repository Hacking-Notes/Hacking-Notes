  <pattern id="cd" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#059669" fill-opacity=".15"/></pattern>
  <clipPath id="cf"><rect width="580" height="280" rx="18"/></clipPath>
</defs>
<style>
