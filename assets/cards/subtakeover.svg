  .blink{animation:bk 1.2s step-end infinite} @keyframes bk{50%{opacity:.2}}
  .flo{animation:flo 4s ease-in-out infinite} @keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .dng{animation:dng 2.6s ease-in-out infinite}@keyframes dng{0%,100%{opacity:.5}50%{opacity:1}}.brk{stroke-dasharray:5 5;animation:brk 1s linear infinite}@keyframes brk{to{stroke-dashoffset:-20}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
