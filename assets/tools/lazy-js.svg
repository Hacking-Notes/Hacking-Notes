<svg xmlns="http://www.w3.org/2000/svg" width="360" height="150" viewBox="0 0 360 150" role="img" aria-label="lazy-js">
<title>lazy-js</title>
<defs><radialGradient id="g" cx=".15" cy=".2" r=".9"><stop offset="0" stop-color="#0891b2" stop-opacity=".16"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient></defs>
<style>.sweep{stroke-dasharray:24 100;animation:sw 5s linear infinite}@keyframes sw{to{stroke-dashoffset:-124}}
.flo{animation:flo 4s ease-in-out infinite}@keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.bk{animation:bk 1.3s step-end infinite}@keyframes bk{50%{opacity:.2}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
